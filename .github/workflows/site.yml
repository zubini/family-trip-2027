name: Seite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prüfen, ob docs/index.html zum Quellcode passt
        run: make check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Veröffentlichung auf GitHub Pages ist bewusst abgeschaltet.
  # Einschalten: Settings → Pages → Source "GitHub Actions" und
  # Settings → Secrets and variables → Actions → Variable DEPLOY_PAGES = true
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
