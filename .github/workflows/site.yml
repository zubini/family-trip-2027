name: Seite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten prüfen
        run: node tools/pruefen.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Veröffentlicht die Seite auf GitHub Pages bei jedem Push auf den Standard-Branch.
  deploy:
    needs: pruefen
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
